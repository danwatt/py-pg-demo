site_name: PG Demo Showcase
docs_dir: build/staging
site_dir: build/site
nav:
  - Home: index.md
  - Demos:
      - Intro: demos/01_intro.md
theme:
  name: material
markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences